[project]
name = "hkdfguard-cryptosession-aesgcm256"
version = "0.1.0"
description = "AES-256-GCM encrypt/decrypt sessions for HkdfGuard, backed by a periodically-refreshed unwrapped DEK. Python port of HkdfGuard.CryptoSession.AesGcm256, using pyca/cryptography for AES-GCM."
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "hkdfguard-abstractions",
    "hkdfguard-diagnostics",
]

[tool.uv.sources]
hkdfguard-abstractions = { workspace = true }
hkdfguard-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_cryptosession_aesgcm256"]
