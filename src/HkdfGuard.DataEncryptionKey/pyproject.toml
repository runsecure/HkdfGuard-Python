[project]
name = "hkdfguard-dataencryptionkey"
version = "0.1.0"
description = "Data-encryption-key management for HkdfGuard: wrapped/pipeline keys, a versioned KeyRing, and a name-scoped IDataProtector. Python port of HkdfGuard.DataEncryptionKey."
requires-python = ">=3.11"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-diagnostics",
]

[tool.uv.sources]
hkdfguard-abstractions = { workspace = true }
hkdfguard-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_dataencryptionkey"]
