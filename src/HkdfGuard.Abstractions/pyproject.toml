[project]
name = "hkdfguard-abstractions"
version = "0.1.0"
description = "Shared interfaces and cross-cutting types for HkdfGuard components. Partial Python port of HkdfGuard.Abstractions - ported incrementally, one member at a time, alongside whichever component first needs it."
requires-python = ">=3.11"
dependencies = [
    "hkdfguard-diagnostics",
]

[tool.uv.sources]
hkdfguard-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_abstractions"]
