[project]
name = "hkdfguard-diagnostics"
version = "0.1.0"
description = "Shared OpenTelemetry activity/metric/event naming and telemetry helpers for HkdfGuard components."
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-api>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_diagnostics"]
