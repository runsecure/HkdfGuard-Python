[project]
name = "hkdfguard-keywrapping-v1"
version = "0.1.0"
description = "Native KMS-backed key wrapping (wrap/unwrap DEK) for HkdfGuard. Python port of HkdfGuard.KeyWrapping.V1, binding each platform's native HkdfGuard KMS library via ctypes."
requires-python = ">=3.11"
dependencies = [
    "hkdfguard-abstractions",
]

[tool.uv.sources]
hkdfguard-abstractions = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_keywrapping_v1"]
