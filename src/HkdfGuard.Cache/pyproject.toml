[project]
name = "hkdfguard-cache"
version = "0.1.0"
description = "Highly concurrent, encrypted in-memory name/value cache for HkdfGuard, backed by a single IDataEncryptionKey. Python port of HkdfGuard.Cache."
requires-python = ">=3.11"
dependencies = [
    "hkdfguard-abstractions",
    "hkdfguard-diagnostics",
]

[tool.uv.sources]
hkdfguard-abstractions = { workspace = true }
hkdfguard-diagnostics = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hkdfguard_cache"]
