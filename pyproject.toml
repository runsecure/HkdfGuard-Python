[project]
name = "hkdfguard-python"
version = "0.1.0"
description = "Python port of the HkdfGuard .NET solution."
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["src/*", "test/*"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
pythonpath = [
    "src/HkdfGuard.Diagnostics",
    "src/HkdfGuard.Abstractions",
    "src/HkdfGuard.KeyWrapping.V1",
    "src/HkdfGuard.CryptoSession.AesGcm256",
    "src/HkdfGuard.DataEncryptionKey",
    "src/HkdfGuard.Cache",
]
